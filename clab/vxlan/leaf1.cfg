!
enable
configure terminal
!
hostname leaf1
!
username admin privilege 15 secret admin
!
interface Ethernet1
   no switchport
   ip address 10.0.1.2/30
   ip ospf area 0
!
interface Loopback0
   ip address 1.1.1.1/32
   ip ospf area 0
!
ip routing
!
vlan 10
   name VLAN10
!
interface vxlan 1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan flood vtep 2.2.2.2
!
router ospf 1
   router-id 1.1.1.1
!
interface Ethernet2
   switchport mode access
   switchport access vlan 10
