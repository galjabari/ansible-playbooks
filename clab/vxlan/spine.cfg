!
enable
configure terminal
!
hostname spine
!
username admin privilege 15 secret admin
!
interface Ethernet1
   no switchport
   ip address 10.0.1.1/30
   ip ospf area 0
!
interface Ethernet2
   no switchport
   ip address 10.0.1.5/30
   ip ospf area 0
!
interface Loopback0
   ip address 3.3.3.3/32
   ip ospf area 0
!
ip routing
!
router ospf 1
   router-id 3.3.3.3
