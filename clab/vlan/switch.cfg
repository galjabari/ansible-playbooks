!
enable
configure terminal
!
hostname cEOS-Switch
!
vlan 10
   name VLAN10
vlan 20
   name VLAN20
!
interface Ethernet1
   switchport mode access
   switchport access vlan 10
!
interface Ethernet2
   switchport mode access
   switchport access vlan 20
!
interface Ethernet3
   switchport mode trunk
   switchport trunk allowed vlan 10,20
!
end