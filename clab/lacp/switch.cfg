!
enable
configure terminal
!
username admin privilege 15 secret admin
!
vlan 10
   name VLAN10
vlan 20
   name VLAN20
!
interface Ethernet1
   channel-group 1 mode active
!
interface Ethernet2
   channel-group 1 mode active
!
interface Port-Channel1
   switchport mode trunk
   switchport trunk allowed vlan 10,20
!
end