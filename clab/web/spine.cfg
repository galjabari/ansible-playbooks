!
enable
configure
!
username admin privilege 15 secret admin
!
ip routing
!
interface Ethernet1
  no switchport
  ip address 192.168.1.2/30
!
interface Ethernet2
  no switchport
  ip address 192.168.1.6/30
!
interface Loopback0
  ip address 10.10.10.3/32
!
router ospf 1
  router-id 10.10.10.3
  network 192.168.1.0/30 area 0
  network 192.168.1.4/30 area 0
!
end
