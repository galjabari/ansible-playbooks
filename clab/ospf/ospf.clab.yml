name: ospf

topology:
  nodes:
    # Spine (Arista cEOS)
    spine:
      kind: arista_ceos
      image: takfa19/ceos:4.32.2F

    # Leaf 1 (Arista cEOS)
    leaf1:
      kind: arista_ceos
      image: takfa19/ceos:4.32.2F

    # Leaf 2 (Arista cEOS)
    leaf2:
      kind: arista_ceos
      image: takfa19/ceos:4.32.2F

    # Client 1 (Linux container)
    client1:
      kind: linux
      image: alpine:latest  # Lightweight Linux image
      exec:
        - ip addr add 192.168.10.2/24 dev eth1
        - ip route replace default via 192.168.10.1

    # Client 2 (Linux container)
    client2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.20.2/24 dev eth1
        - ip route replace default via 192.168.20.1

  links:
    # Link between spine and leaf 1
    - endpoints: ["spine:eth1", "leaf1:eth1"]
    # Link between spine and leaf 2
    - endpoints: ["spine:eth2", "leaf2:eth1"]
    # Link between leaf 1 and client 1
    - endpoints: ["leaf1:eth2", "client1:eth1"]
    # Link between leaf 2 and client 2
    - endpoints: ["leaf2:eth2", "client2:eth1"]
