!
enable
configure
!
username admin privilege 15 secret admin
!
ip routing
!
interface Ethernet1
  no switchport
  ip address 192.168.1.5/30
!
interface Ethernet2
  no switchport
  ip address 192.168.20.1/24
!
interface Loopback0
  ip address 10.10.10.2/32
!
router ospf 1
  router-id 10.10.10.2
  network 192.168.1.4/30 area 0
  network 192.168.20.0/24 area 0
!
end
