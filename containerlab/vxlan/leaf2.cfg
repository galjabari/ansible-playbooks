!
enable
configure terminal
!
hostname leaf2
!
username admin privilege 15 secret admin
!
interface Ethernet1
   no switchport
   ip address 10.0.1.6/30
   ip ospf area 0
!
interface Loopback0
   ip address 2.2.2.2/32
   ip ospf area 0
!
ip routing
!
vlan 10
   name VLAN10
!
interface vxlan 1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan flood vtep 1.1.1.1
!
router ospf 1
   router-id 2.2.2.2
!
interface Ethernet2
   switchport mode access
   switchport access vlan 10
