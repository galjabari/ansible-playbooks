!
enable
configure terminal
!
username admin privilege 15 secret admin
!
ip routing
!
interface Ethernet1
   no switchport
   ip address 192.168.10.1/24
   dhcp server ipv4
!
dhcp server
   subnet 192.168.10.0/24
      range 192.168.10.20 192.168.10.100
      default-gateway 192.168.10.1
   !
   lease time ipv4 1 days 0 hours 0 minutes
!
end