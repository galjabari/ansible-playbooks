name: ospf

topology:
  nodes:
    # Spine (Arista cEOS)
    spine:
      kind: arista_ceos
      image: takfa19/ceos:4.32.2F

    # Leaf 1 (Arista cEOS)
    leaf1:
      kind: arista_ceos
      image: takfa19/ceos:4.32.2F

    # Leaf 2 (Arista cEOS)
    leaf2:
      kind: arista_ceos
      image: takfa19/ceos:4.32.2F

  links:
    # Link between spine and leaf 1
    - endpoints: ["spine:eth1", "leaf1:eth1"]
    # Link between spine and leaf 2
    - endpoints: ["spine:eth2", "leaf2:eth1"]
